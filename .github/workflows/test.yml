name: SSH into Docker

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install packages
        run: |
          sudo apt-get update -y && sudo apt-get install -y openjdk-21-jdk wget git
          sudo apt-get install -y \
            git make gcc g++ pkg-config \
            libssl-dev libzip-dev libxxhash-dev \
            libcapstone-dev libmagic-dev \
            libjemalloc-dev libuv1-dev \
            python3-pip curl

      - name: Download and setup tools
        run: |
          wget https://github.com/coderredz/Rvanka/releases/download/v1.0.0/rvanka-10-920.apk
          wget https://github.com/coderredz/Rvanka/releases/download/1.11/jadx-1.5.3-all.jar
          mv rvanka-10-920.apk ~/
          git clone https://github.com/coderredz/Rvanka.git
          sudo mv Rvanka/jadx-gui /usr/bin
          sudo mv Rvanka/jadx /usr/bin
          sudo mv jadx-1.5.3-all.jar /usr/lib
          sudo chmod +x /usr/bin/jadx
          sudo chmod +x /usr/bin/jadx-gui
          sudo chmod +x /usr/lib/jadx-1.5.3-all.jar
          echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> $GITHUB_ENV
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH

      - name: Decompile APK (ignore exit code)
        run: |
          jadx -d output ~/rvanka-10-920.apk || true
          echo "Decompilation completed (ignoring exit code)"

      - name: Wait and check output
        run: |
          sleep 10
          if [ -d "output" ]; then
            echo "Output directory exists with $(find output -type f | wc -l) files"
            ls -la output/
          else
            echo "Output directory does not exist"
          fi

      - name: List files
        run: |
          ls -la

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-output
          path: output
